name: Deploy to GitHub Pages

# Publishes the built app (dist/) to https://<user>.github.io/<repo>/.
#
# This is required because GitHub Pages only serves static files: the previous
# setup published the repository root straight from a branch, so visitors were
# handed index.html pointing at /src/main.tsx — raw TypeScript no browser can
# run, hence the blank page.  Building here means the site always reflects
# main, and nothing build-specific has to be committed.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one deployment at a time; queue rather than cancel so a half
# finished upload can never leave the site in a broken state.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        # Project pages are served from a /<repo>/ subpath, so asset URLs must
        # be prefixed with it.  PAGES_BASE is read by vite.config.ts.
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
